<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nityaseva — Login</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <h2>Nityaseva Care</h2>
      <p style="font-size: 13px; color: #718096; margin-bottom: 20px;">Secure Access Portal</p>

      <div id="step-email">
        <div class="form-group">
          <label for="email">Registered Email</label>
          <input type="email" id="email" placeholder="name@example.com" required>
        </div>
        <div class="form-group">
          <label for="password">Password (Optional for Dev Test)</label>
          <input type="password" id="password" placeholder="Leave empty for OTP login">
        </div>
        <button id="btn-login" style="width: 100%;">Sign In</button>
      </div>

      <div id="step-otp" class="hidden">
        <div class="form-group">
          <label for="otp">Enter 6-Digit OTP</label>
          <input type="text" id="otp" placeholder="123456" maxlength="6">
        </div>
        <button id="btn-verify-otp" style="width: 100%;">Verify Code</button>
      </div>

      <div id="msg" class="message hidden"></div>
    </div>
  </div>

  <script type="module">
    import { supabase } from './js/supabaseClient.js';
    import { callApi } from './js/dataService.js';

    const stepEmail = document.getElementById('step-email');
    const stepOtp = document.getElementById('step-otp');
    const emailInput = document.getElementById('email');
    const passInput = document.getElementById('password');
    const otpInput = document.getElementById('otp');
    const msg = document.getElementById('msg');

    function showMsg(text, isError = false) {
      msg.textContent = text;
      msg.className = 'message ' + (isError ? 'error' : 'success');
      msg.classList.remove('hidden');
    }

supabase.auth.onAuthStateChange(async (event, session) => {
  if (event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED') {
    showMsg('Login successful! Authorizing profile...');
    try {
      // 1. Call whoAmI instead of getAdminDashboard to get the user's role safely
      const authData = await callApi('whoAmI'); 
      
      if (!authData || !authData.role) throw new Error('No role assigned.');

      // 2. Save role and profile
      localStorage.setItem('nityaseva_role', authData.role);
      localStorage.setItem('nityaseva_user', JSON.stringify(authData.profile || {}));

      // 3. Redirect to the correct page based on role
      window.location.href = authData.role + '.html';
    } catch (err) {
      showMsg('Authorization failed: ' + err.message, true);
      console.error(err);
    }
  }
});



    // Unified Login Handler
    document.getElementById('btn-login').addEventListener('click', async () => {
      const email = emailInput.value.trim();
      const password = passInput.value.trim();

      if (!email) return showMsg('Please enter your email', true);

      // If user typed a password, use standard login (bypasses email quota)
      if (password) {
        const { error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) showMsg(error.message, true);
      } else {
        // Otherwise, trigger OTP/Magic Link
        const { error } = await supabase.auth.signInWithOtp({ email });
        if (error) return showMsg(error.message, true);
        stepEmail.classList.add('hidden');
        stepOtp.classList.remove('hidden');
        showMsg('OTP sent to your email.');
      }
    });

    // Verify OTP manually
    document.getElementById('btn-verify-otp').addEventListener('click', async () => {
      const email = emailInput.value.trim();
      const token = otpInput.value.trim();
      const { error } = await supabase.auth.verifyOtp({ email, token, type: 'email' });
      if (error) showMsg(error.message, true);
    });
  </script>
</body>
</html>
