<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nurse Field Care — Nityaseva</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Keep your existing style block here, just make sure to add these to the bottom of the <style> block: */
    .cockpit-actions-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
    .btn-action-tile { background: #ffffff; border: 1px solid #cbd5e1; border-radius: 16px; padding: 14px; cursor: pointer; }
    .btn-conclude-full { background: #dc2626; color: white; width: 100%; padding: 15px; border-radius: 16px; border: none; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="app-viewport">
    <!-- Existing Profile/App Bar and Route List -->
    <div id="route-list-container"></div>
  </div>

  <!-- SINGLE CLEAN COCKPIT MODAL -->
  <div id="cockpit-overlay" class="modal-sheet-overlay hidden">
    <div class="modal-sheet cockpit-view">
      <div class="modal-top-notch"><span class="otp-protected-chip">🔒 VISIT ACTIVE</span><button class="modal-close-btn" id="btn-close-cockpit">✕</button></div>
      <h2 id="cockpit-senior-name">Senior Name</h2>
      <div class="live-timer-card"><div class="timer-main-display" id="live-timer-display">00:00:00</div></div>
      
      <div class="cockpit-actions-grid">
        <button id="btn-sos-trigger-cockpit" class="btn-action-tile"><strong>🚨 SOS</strong></button>
        <button id="btn-call-office" class="btn-action-tile"><strong>📞 Support</strong></button>
      </div>

      <div class="card" style="margin-top:10px; padding:15px;">
        <label>Cancel Visit</label>
        <select id="cancel-reason-dropdown" style="width:100%; padding:8px;">
          <option value="">Select Reason</option>
          <option value="Senior not available">Senior not available</option>
          <option value="Other">Other</option>
        </select>
        <button onclick="handleCancelBooking()" class="btn-conclude-full" style="background:#718096;">Cancel Booking</button>
      </div>

      <textarea id="visit-remarks" rows="3" placeholder="Mandatory: Visit remarks..." style="width:100%; margin-top:10px; padding:10px;"></textarea>
      <button class="btn-conclude-full" id="btn-open-end-code">🏁 Conclude Visit</button>
    </div>
  </div>

  <!-- Other Modals (Assessment, etc.) stay here -->
  <script type="module" src="js/nurse.js"></script>
</body>
</html>
