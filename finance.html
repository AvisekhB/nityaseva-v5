<!DOCTYPE html>
<html>
<head>
  <title>Nityaseva Finance Portal</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header><h1>Finance Operations</h1><button id="btn-logout">Logout</button></header>
  <main>
    <!-- Revenue Summary -->
    <div class="grid">
      <div class="stat-box"><div class="number" id="rev-total">₹0</div><div class="label">Total Paid Revenue</div></div>
      <div class="stat-box"><div class="number" id="rev-pending">0</div><div class="label">Pending Invoices</div></div>
    </div>

    <!-- Invoice Creation -->
    <div class="card">
      <h2>Generate New Invoice</h2>
      <form id="invoice-form">
        <div class="form-group"><label>Senior ID</label><input type="text" id="inv-senior" required></div>
        <div class="form-group"><label>Amount (₹)</label><input type="number" id="inv-amount" required></div>
        <div class="form-group"><label>Due Date</label><input type="date" id="inv-due" required></div>
        <button type="submit">Create Invoice</button>
      </form>
    </div>

    <!-- Pending Invoices List -->
    <div class="card">
      <h2>Pending Invoices</h2>
      <table id="invoice-table">
        <thead><tr><th>ID</th><th>Senior</th><th>Amount</th><th>Due Date</th><th>Action</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </main>
  <script type="module" src="js/finance.js"></script>
</body>
</html>
